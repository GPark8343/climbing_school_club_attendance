<!DOCTYPE html>
<html lang="en">  
<script src=
"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js">
</script>

<script>
var ipAddress; 
       /* Add "https://api.ipify.org?format=json" to 
        get the IP Address of user*/
        $(document).ready(()=>{
            $.getJSON("https://api64.ipify.org?format=json",
            function (data) {
 
             ipAddress = data.ip;
            })
        });

function getLocation(name, studentID, document) {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition);
  }
}

function showPosition(position) {
     console.log(`position: ${position}`);
  var a = position.coords.latitude;
  var b = position.coords.longitude;
  var c = [a, b];
  var formData = {
    name: document.querySelector('input[name="name"]').value,
    studentID: document.querySelector('input[name="studentID"]').value,
    department: document.querySelector('input[name="department"]').value,
    location: c,
    ipAddress: ipAddress
  };
  getPos(formData);
}

function showSubmissionText() {
  // 제출 완료 텍스트 생성
  var submissionText = document.createElement('p');
  submissionText.textContent = '제출 완료';
   document.body.innerHTML = '';
  submissionText.classList.add('submission-text');
  // body에 추가
  document.body.appendChild(submissionText);
}

function getPos(value) {
  google.script.run.withSuccessHandler(showSubmissionText).getLoc(value);
}

document.addEventListener('DOMContentLoaded', function() {
  var form = document.querySelector('form');
  form.addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent default form submission
    getLocation(); // Call getLocation() when form is submitted
  });
});


 window.onload = function() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://script.google.com/macros/s/AKfycbxpxxxxxx/exec');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === XMLHttpRequest.DONE && xhr.status === 200) {
      var ipAddress = xhr.responseText;
      console.log("클라이언트의 IP 주소:", ipAddress);
      
    
    }
  };
  xhr.send();
}

</script>
